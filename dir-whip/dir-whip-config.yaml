# dir-whip configuration
# User-managed. See after-install.md for configuration instructions.
#
# RUNTIME LOCATION (SCR-013): the config that the plugin and the audit
# actually read lives at HERMES_HOME/dir-whip/dir-whip-config.yaml
# (Windows: %LOCALAPPDATA%/hermes/dir-whip/dir-whip-config.yaml;
# POSIX: ~/.hermes/dir-whip/dir-whip-config.yaml). This file in the
# plugin directory is ONLY the shipped template: forced plugin reinstalls
# never touch the runtime copy, so user settings survive.

# Optional override: working_dir_root (authoritative when set; fallback =
# current profile's terminal.cwd). Remove the # to pin the Working Directory.
# working_dir_root: E:/HermesWorkspace/default

exempt_paths: []

# Root files allowed at the Working Directory root (D1: guard and
# audit read the same key; strict fallback = empty list when absent).
allowed_root_files: ["AGENTS.md"]