# dir-whip configuration
# User-managed. See after-install.md for configuration instructions.
#
# RUNTIME LOCATION (SCR-013): the config that the plugin and the audit
# actually read lives at HERMES_HOME/dir-whip/dir-whip-config.yaml
# (Windows: %LOCALAPPDATA%/hermes/dir-whip/dir-whip-config.yaml;
# POSIX: ~/.hermes/dir-whip/dir-whip-config.yaml). This file in the
# plugin directory is ONLY the shipped template: forced plugin reinstalls
# never touch the runtime copy, so user settings survive.

# Optional override: working_dir_root (authoritative when set; fallback =
# current profile's terminal.cwd). Remove the # to pin the Working Directory.
# working_dir_root: E:/HermesWorkspace/default

# Single unified allowlist (B2, v2.6): file:<basename> | prefix:<abs-path>
# file:<basename>  -> root file allowed at Working Directory root
# prefix:<abs-path> -> exempt prefix (project dir inside workspace, may end with /)
# Use forward slashes for prefixes. Missing key -> strict empty allowlist (fail-closed).
# Old keys exempt_paths / allowed_root_files are removed (no backward compat, B2).
allowlist: []  # e.g. file:README.md , prefix:E:/HermesWorkspace/learn/projects/foo

# Write audit (5.18): post-hoc snapshot diff catches root writes the front
# guard lets through. Further writes frozen until remediation.
# write_audit: enabled          # default when absent
# write_audit_entry_cap: 2000   # root entries cap; round skipped + WARNING on exceed
