name: dir-whip
version: 0.6.3
description: Enforce Working Directory file discipline in Hermes
api_version: 1
author: shawVV1992
license: MIT
provides_hooks:
  - pre_tool_call
  - on_session_start
  - post_tool_call
  - transform_tool_result
  - post_approval_response
  - subagent_start
  - subagent_stop
  - pre_command
  - pre_verify
emits:
  - dir-whip:blocked
  - dir-whip:external-write
  - dir-whip:allowlisted
  - dir-whip:approval-requested
  - dir-whip:approval-resolved
  - dir-whip:write-audit-violation
  - dir-whip:write-audit-gate-block
