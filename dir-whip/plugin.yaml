name: dir-whip
version: 0.2.0
description: Enforce Working Directory file discipline in Hermes
manifest_version: 2
api_version: 1
author: shawVV1992
license: MIT
provides_hooks:
  - pre_tool_call
  - on_session_start
  - post_tool_call
  - post_approval_response
  - subagent_start
  - subagent_stop
  - pre_command
emits:
  - dir-whip:blocked
  - dir-whip:external-write
  - dir-whip:allowlisted
  - dir-whip:approval-requested
  - dir-whip:approval-resolved
