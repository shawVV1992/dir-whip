<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="startGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="allowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a2a"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f12"/>
      <stop offset="100%" stop-color="#241b08"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a1f"/>
      <stop offset="100%" stop-color="#240d10"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="ah-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="860" height="700" fill="url(#bg)"/>
  <rect width="860" height="700" fill="url(#dots)"/>

  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430,85 L430,125" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M430,175 L430,215" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M430,265 L430,305" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M330,355 L330,390 L240,390 L240,427" stroke="#d29922" marker-end="url(#ah-amber)"/>
    <path d="M530,355 L530,390 L620,390 L620,427" stroke="#f85149" marker-end="url(#ah-red)"/>
    <path d="M240,483 L240,510 L360,510 L360,537" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M620,483 L620,510 L500,510 L500,537" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M430,593 L430,632" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
  </g>

  <g font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="central"
     paint-order="stroke" stroke="#0a0e14" stroke-width="3.5" stroke-linejoin="round">
    <text x="285" y="378" fill="#f0b429">写入被拦截</text>
    <text x="575" y="378" fill="#ff7b72">根级违规</text>
  </g>

  <rect x="320" y="35" width="220" height="50" rx="25" fill="url(#startGrad)" stroke="#67e8f9" stroke-width="1.5" filter="url(#glow)"/>
  <text x="430" y="60" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#ffffff">父代委托任务</text>

  <rect x="310" y="125" width="240" height="50" rx="10" fill="url(#procGrad)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="150" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">subagent_start 登记</text>

  <rect x="290" y="215" width="280" height="50" rx="10" fill="url(#procGrad)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="240" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">父代确保目标目录存在</text>

  <rect x="290" y="305" width="280" height="50" rx="10" fill="url(#procGrad)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="330" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">子代理写入指定目录</text>

  <rect x="140" y="427" width="200" height="56" rx="10" fill="url(#logGrad)" stroke="#d29922" stroke-width="1.8" filter="url(#soft)"/>
  <text x="240" y="455" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#f0b429">向父代上报</text>

  <rect x="480" y="427" width="280" height="56" rx="10" fill="url(#blockGrad)" stroke="#f85149" stroke-width="1.8" filter="url(#soft)"/>
  <text x="620" y="455" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#ff7b72">违规挂父 pending 集合</text>

  <rect x="290" y="537" width="280" height="56" rx="10" fill="url(#allowGrad)" stroke="#3fb950" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="565" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#7ee787">父代清偿与审阅</text>

  <rect x="290" y="632" width="280" height="50" rx="10" fill="url(#procGrad)" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="657" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">subagent_stop 解除登记</text>
</svg>
