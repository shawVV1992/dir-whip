<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="startGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="diaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2150"/>
      <stop offset="100%" stop-color="#1a1438"/>
    </linearGradient>
    <linearGradient id="allowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b3a2a"/>
      <stop offset="100%" stop-color="#0f2419"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a1f"/>
      <stop offset="100%" stop-color="#240d10"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="ah-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="url(#bg)"/>
  <rect width="880" height="620" fill="url(#dots)"/>

  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430,85 L430,125" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M430,215 L430,255" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M430,345 L430,385" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M540,170 L610,170" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M545,300 L650,300 L650,198" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M540,430 L690,430 L690,198" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M430,475 L430,527" stroke="#f85149" marker-end="url(#ah-red)"/>
  </g>

  <g font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central"
     paint-order="stroke" stroke="#0a0e14" stroke-width="3.5" stroke-linejoin="round">
    <text x="572" y="157" fill="#7ee787">是</text>
    <text x="402" y="238" fill="#22d3ee">否</text>
    <text x="592" y="287" fill="#7ee787">是</text>
    <text x="598" y="417" fill="#7ee787">命中</text>
    <text x="398" y="368" fill="#22d3ee">否</text>
    <text x="398" y="505" fill="#ff7b72">未命中</text>
  </g>

  <rect x="290" y="35" width="280" height="50" rx="25" fill="url(#startGrad)" stroke="#67e8f9" stroke-width="1.5" filter="url(#glow)"/>
  <text x="430" y="60" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#ffffff">config working_dir_root</text>

  <polygon points="430,125 540,170 430,215 320,170" fill="url(#diaGrad)" stroke="#a371f7" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="170" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">已设置？</text>

  <rect x="610" y="142" width="220" height="56" rx="10" fill="url(#allowGrad)" stroke="#3fb950" stroke-width="1.8" filter="url(#soft)"/>
  <text x="720" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#7ee787">工作目录 = 覆盖值</text>

  <polygon points="430,255 545,300 430,345 315,300" fill="url(#diaGrad)" stroke="#a371f7" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="300" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">档案 terminal.cwd？</text>

  <polygon points="430,385 540,430 430,475 320,430" fill="url(#diaGrad)" stroke="#a371f7" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="430" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e6edf3">候选根匹配</text>

  <rect x="290" y="527" width="280" height="56" rx="10" fill="url(#blockGrad)" stroke="#f85149" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="555" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ff7b72">回退 CWD / exit 2</text>
</svg>
