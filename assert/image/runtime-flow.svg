<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3a5e"/>
      <stop offset="100%" stop-color="#12263f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2f12"/>
      <stop offset="100%" stop-color="#241b08"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1a1f"/>
      <stop offset="100%" stop-color="#240d10"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262c36"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="ah-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <marker id="ah-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d29922"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="960" height="1100" fill="url(#bg)"/>
  <rect width="960" height="1100" fill="url(#dots)"/>

  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#e6edf3"
        paint-order="stroke" stroke="#0a0e14" stroke-width="4" stroke-linejoin="round">dir-whip 四级审计阶梯（写类调用的清偿闭环）</text>

  <!-- ======== 边（下层） ======== -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430,116 L430,150" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M566,184 L654,184" stroke="#f85149" marker-end="url(#ah-red)"/>
    <path d="M430,240 L430,262" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M566,304 L654,304" stroke="#3fb950" marker-end="url(#ah-green)"/>
    <path d="M430,340 L430,374" stroke="#f85149" marker-end="url(#ah-red)"/>
    <path d="M430,440 L430,478" stroke="#d29922" marker-end="url(#ah-amber)"/>
    <path d="M430,568 L430,594" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah-cyan)"/>
    <path d="M430,684 L430,710" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah-cyan)"/>
    <path d="M430,800 L430,826" stroke="#22d3ee" stroke-width="2" marker-end="url(#ah-cyan)"/>
    <path d="M430,928 L430,966" stroke="#22d3ee" marker-end="url(#ah-cyan)"/>
    <path d="M566,408 L780,408 L780,582" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-amber)"/>
    <path d="M780,652 L780,874 L586,874" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-amber)"/>
    <path d="M300,1000 L26,1000 L26,88 L294,88" stroke="#3fb950" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah-green)"/>
  </g>

  <!-- ======== 边标签 ======== -->
  <g font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central"
     paint-order="stroke" stroke="#0a0e14" stroke-width="3.5" stroke-linejoin="round">
    <text x="606" y="172" fill="#ff7b72">违规</text>
    <text x="444" y="247" fill="#22d3ee">放行</text>
    <text x="606" y="292" fill="#7ee787">无违规</text>
    <text x="444" y="359" fill="#ff7b72">违规</text>
    <text x="670" y="396" fill="#f0b429">收尾仍受阻</text>
  </g>
  <text transform="rotate(-90 13 540)" x="13" y="540" text-anchor="middle" font-size="11" fill="#7ee787" opacity="0.9"
        paint-order="stroke" stroke="#0a0e14" stroke-width="3" stroke-linejoin="round">重扫通过 · 闩锁解除</text>

  <!-- ======== 节点 ======== -->
  <rect x="300" y="60" width="260" height="56" rx="10" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ffffff">写类工具调用</text>
  <text x="430" y="101" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#cffafe">write_file · patch · terminal</text>

  <rect x="300" y="156" width="260" height="84" rx="10" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ffffff">前置层三态判定</text>
  <text x="430" y="198" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#cffafe">确定性 → 分类链 · 不确定 → 放行记日志</text>
  <text x="430" y="212" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#cffafe">设备/只读 → 静默放行</text>
  <text x="430" y="226" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#cffafe">二次创建会话目录 → 拦截（session-dir-limit）</text>

  <rect x="660" y="156" width="260" height="56" rx="10" fill="url(#redGrad)" stroke="#f85149" stroke-width="1.8" filter="url(#soft)"/>
  <text x="790" y="184" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ff7b72">block + 修正指引</text>

  <rect x="300" y="268" width="260" height="72" rx="10" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="1.5" filter="url(#soft)"/>
  <text x="430" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ffffff">审计快照 diff</text>
  <text x="430" y="316" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#cffafe">仅放行的终端命令 · 仅根级文件条目</text>

  <rect x="660" y="276" width="240" height="56" rx="10" fill="url(#slateGrad)" stroke="#3fb950" stroke-width="1.8" filter="url(#soft)"/>
  <text x="780" y="304" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#7ee787">本轮结束</text>

  <rect x="300" y="380" width="260" height="60" rx="10" fill="url(#redGrad)" stroke="#f85149" stroke-width="1.8" filter="url(#soft)"/>
  <text x="430" y="401" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#ff7b72">pending 集合</text>
  <text x="430" y="423" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">会话作用域 · 子代理挂父集合</text>

  <!-- ======== 四级阶梯 ======== -->
  <rect x="280" y="484" width="300" height="84" rx="12" fill="url(#amberGrad)" stroke="#d29922" stroke-width="2" filter="url(#glow)"/>
  <text x="430" y="510" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#f0b429">L1 · teach 通告</text>
  <text x="430" y="536" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">fire-once——唯一不阻断的对话内通告 · 列出路</text>
  <text x="430" y="552" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">懒注册 settle 工具</text>

  <rect x="280" y="600" width="300" height="84" rx="12" fill="url(#slateGrad)" stroke="#8b949e" stroke-width="2" filter="url(#soft)"/>
  <text x="430" y="626" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#e6edf3">L2 · record 记录</text>
  <text x="430" y="654" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">write-audit-* 统计与事件（纯后台）</text>

  <rect x="280" y="716" width="300" height="84" rx="12" fill="url(#redGrad)" stroke="#f85149" stroke-width="2" filter="url(#glow)"/>
  <text x="430" y="742" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#ff7b72">L3 · gate 闩锁</text>
  <text x="430" y="770" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">冻结所有写类调用（含 rm / 配置编辑）</text>

  <rect x="280" y="832" width="300" height="96" rx="12" fill="url(#blueGrad)" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <text x="430" y="856" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#79c0ff">L4 · remediate 清偿</text>
  <text x="430" y="880" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">① settle → 隔离区 ② 移入会话目录（带外）</text>
  <text x="430" y="902" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">③ 用户 /dir-whip allow ④ 带外移除</text>

  <rect x="300" y="972" width="260" height="56" rx="28" fill="url(#cyanGrad)" stroke="#67e8f9" stroke-width="1.6" filter="url(#glow)"/>
  <text x="430" y="1000" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#ffffff">pending 清空 · 闩锁解除</text>

  <rect x="660" y="588" width="240" height="64" rx="10" fill="url(#amberGrad)" stroke="#d29922" stroke-width="1.8" filter="url(#soft)"/>
  <text x="780" y="611" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="700" fill="#f0b429">pre_verify 续推兜底</text>
  <text x="780" y="633" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#8b949e">每会话上限 3 次</text>

  <!-- ======== 图例 ======== -->
  <g font-size="12" fill="#8b949e" dominant-baseline="central">
    <rect x="40" y="1064" width="14" height="14" rx="3" fill="#f85149" fill-opacity="0.25" stroke="#f85149"/>
    <text x="62" y="1071">拦截 · 闩锁</text>
    <rect x="170" y="1064" width="14" height="14" rx="3" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee"/>
    <text x="192" y="1071">主干 · 清偿</text>
    <rect x="300" y="1064" width="14" height="14" rx="3" fill="#d29922" fill-opacity="0.25" stroke="#d29922"/>
    <text x="322" y="1071">通告 · 兜底</text>
    <rect x="430" y="1064" width="14" height="14" rx="3" fill="#58a6ff" fill-opacity="0.25" stroke="#58a6ff"/>
    <text x="452" y="1071">清偿出路</text>
    <rect x="560" y="1064" width="14" height="14" rx="3" fill="#8b949e" fill-opacity="0.25" stroke="#8b949e"/>
    <text x="582" y="1071">后台记录</text>
  </g>
</svg>
